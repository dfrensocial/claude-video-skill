<!doctype html>
<html lang="en" data-resolution="portrait"
  data-composition-variables='[
    {"id":"tone","type":"string","label":"lime | white | warm","default":"lime"},
    {"id":"seed","type":"number","label":"Ray pattern seed","default":3},
    {"id":"cx","type":"number","label":"Burst centre x (px)","default":540},
    {"id":"cy","type":"number","label":"Burst centre y (px)","default":900}
  ]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 100%; height: 100%; background: transparent; }
      canvas { position: absolute; inset: 0; width: 1080px; height: 1920px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="burst" data-start="0" data-duration="1.6" data-width="1080" data-height="1920">
      <div class="clip" data-start="0" data-duration="1.6" data-track-index="0" style="position:absolute;inset:0">
        <canvas id="c" width="1080" height="1920"></canvas>
      </div>
    </div>
    <script>
      // Light-burst cut cover: full-frame flash peaking at 0.20 s (the cut hides under the peak), rays rotating, then clearing.
      // Solid fills only (no gradients) so the alpha overlay does not darken when composited.
      const V = window.__hyperframes.getVariables();
      const cv = document.getElementById("c"), ctx = cv.getContext("2d");
      const TONES = { lime: ["#d4ff1f", "#ffffff"], white: ["#ffffff", "#f4f4ff"], warm: ["#ffe9b0", "#ffffff"] };
      const [base, ray] = TONES[V.tone] || TONES.lime;
      function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
      const R = rng((V.seed || 3) * 131);
      const rays = Array.from({ length: 22 }, () => ({ a: R() * Math.PI * 2, w: 0.04 + R() * 0.11, s: 0.5 + R() * 1.0 }));
      const cx = V.cx ?? 540, cy = V.cy ?? 900;
      const PEAK = 0.2;
      function alpha(t) { return t < PEAK ? Math.pow(t / PEAK, 1.6) : Math.max(0, 1 - Math.pow((t - PEAK) / 0.95, 0.8)); }
      function draw(t) {
        ctx.clearRect(0, 0, 1080, 1920);
        const a = alpha(t);
        if (a <= 0.002) return;
        ctx.globalAlpha = Math.min(1, a * 1.15);            // flat colour wash: opaque at the peak so the cut cannot be seen
        ctx.fillStyle = base; ctx.fillRect(0, 0, 1080, 1920);
        ctx.globalAlpha = Math.min(1, a * 0.95);
        ctx.fillStyle = ray;
        rays.forEach((r) => {
          const ang = r.a + t * r.s * 0.9, len = 2600, hw = r.w * (0.6 + 0.8 * Math.min(1, t / 0.5));
          ctx.beginPath(); ctx.moveTo(cx, cy);
          ctx.lineTo(cx + Math.cos(ang - hw) * len, cy + Math.sin(ang - hw) * len);
          ctx.lineTo(cx + Math.cos(ang + hw) * len, cy + Math.sin(ang + hw) * len);
          ctx.closePath(); ctx.fill();
        });
        // white core bloom as stacked solid discs
        for (let i = 0; i < 6; i++) { ctx.globalAlpha = Math.min(1, a * 0.28); ctx.beginPath(); ctx.arc(cx, cy, 80 + i * 90 * (0.4 + t), 0, 6.283); ctx.fillStyle = "#fff"; ctx.fill(); }
        ctx.globalAlpha = 1;
      }
      const tl = gsap.timeline({ paused: true });
      const o = { t: 0 };
      draw(0);
      tl.to(o, { t: 1.6, duration: 1.6, ease: "none", onUpdate: () => draw(o.t) }, 0);
      window.__timelines["burst"] = tl;
    </script>
  </body>
</html>
