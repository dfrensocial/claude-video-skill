<!doctype html>
<html lang="en" data-resolution="portrait"
  data-composition-variables='[
    {"id":"label","type":"string","label":"Label above the number","default":"Total Amount"},
    {"id":"value","type":"number","label":"Final value","default":151250},
    {"id":"prefix","type":"string","label":"Prefix (e.g. Rs)","default":""},
    {"id":"suffix","type":"string","label":"Suffix (e.g. /-)","default":"/-"},
    {"id":"grouping","type":"string","label":"western or indian digit grouping","default":"western"},
    {"id":"text","type":"color","label":"Number colour","default":"#FFFFFF"},
    {"id":"accent","type":"color","label":"Accent (label + underline)","default":"#E8AA05"},
    {"id":"plate","type":"color","label":"Plate colour (when plate_on is 1)","default":"#0B0A0B"},
    {"id":"plate_on","type":"number","label":"1 = rounded plate behind, 0 = transparent","default":0},
    {"id":"show_s","type":"number","label":"Seconds on screen before exit","default":3},
    {"id":"y_pct","type":"number","label":"Vertical position, % of height","default":34}
  ]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "BebasNeue"; src: url("../assets/fonts/BebasNeue.otf"); }
      @font-face { font-family: "MontserratBold"; src: url("../assets/fonts/Montserrat-Bold.otf"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 100%; height: 100%; background: transparent; }
      #stage { position: absolute; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; }
      #plate { position: absolute; inset: -60px -70px; border-radius: 56px; opacity: 0; }
      #inner { position: relative; display: flex; flex-direction: column; align-items: center; gap: 10px; }
      #label { font-family: "MontserratBold", sans-serif; font-size: 46px; letter-spacing: 0.12em; text-transform: uppercase; opacity: 0; }
      #num { font-family: "BebasNeue", sans-serif; font-size: 300px; line-height: 0.95; letter-spacing: 0.01em; opacity: 0;
             text-shadow: 0 8px 0 rgba(0,0,0,.55), 0 0 40px rgba(0,0,0,.35); -webkit-text-stroke: 8px rgba(0,0,0,.85); paint-order: stroke fill; }
      #bar { height: 12px; width: 0; border-radius: 6px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="count-up" data-start="0" data-duration="5" data-width="1080" data-height="1920">
      <div id="stage" class="clip" data-start="0" data-duration="5" data-track-index="0">
        <div id="inner">
          <div id="plate"></div>
          <div id="label"></div>
          <div id="num"></div>
          <div id="bar"></div>
        </div>
      </div>
    </div>
    <script>
      const V = window.__hyperframes.getVariables();
      const fmt = (n) => {
        const s = Math.round(n).toString();
        if (V.grouping === "indian") {
          return s.length <= 3 ? s : s.slice(0, -3).replace(/\B(?=(\d{2})+(?!\d))/g, ",") + "," + s.slice(-3);
        }
        return s.replace(/\B(?=(\d{3})+(?!\d))/g, ",");
      };
      const $ = (id) => document.getElementById(id);
      $("stage").style.top = V.y_pct + "%";
      $("label").textContent = V.label;
      $("label").style.color = V.accent;
      $("num").style.color = V.text;
      $("bar").style.background = V.accent;
      $("plate").style.background = V.plate;
      const show = Math.max(1.4, Number(V.show_s));
      const o = { v: 0 };
      const paint = () => { $("num").textContent = V.prefix + fmt(o.v) + V.suffix; };
      paint();
      const tl = gsap.timeline({ paused: true });
      if (Number(V.plate_on)) tl.fromTo("#plate", { opacity: 0, scale: 0.9 }, { opacity: 0.92, scale: 1, duration: 0.35, ease: "power3.out" }, 0);
      tl.fromTo("#label", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.05);
      tl.fromTo("#num", { opacity: 0, scale: 0.82 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.7)" }, 0.12);
      tl.to(o, { v: Number(V.value), duration: 1.0, ease: "expo.out", onUpdate: paint }, 0.15);
      tl.fromTo("#bar", { width: 0 }, { width: 420, duration: 0.7, ease: "power3.out" }, 0.5);
      tl.to("#inner", { scale: 1.03, duration: 0.18, ease: "power2.out" }, 1.1).to("#inner", { scale: 1, duration: 0.25, ease: "power2.inOut" }, 1.28);
      tl.to("#inner", { opacity: 0, y: -40, scale: 0.96, duration: 0.35, ease: "power2.in" }, show);
      window.__timelines["count-up"] = tl;
    </script>
  </body>
</html>
