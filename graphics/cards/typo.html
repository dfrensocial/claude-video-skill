      }
      if (parts.length) {
        const tmin = Math.min(...em.map((h) => h.t0)), tmax = Math.max(...em.map((h) => h.t1)) + 2;
        const o = { t: tmin };
        tl.to(o, { t: tmax, duration: tmax - tmin, ease: "none", onUpdate: () => drawEmbers(o.t) }, tmin);
      }
      window.__timelines["typo"] = tl;
    })();
    </script>
  </body>
</html>
